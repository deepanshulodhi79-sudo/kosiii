<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Mail Launcher</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="card">
    <h2>📧 Simple Mailer</h2>

    <div class="input-group">
      <input type="text" id="senderName" placeholder="Sender Name">
      <input type="email" id="email" placeholder="Your Gmail">
    </div>

    <div class="input-group">
      <input type="password" id="pass" placeholder="Gmail App Password">
      <input type="text" id="subject" placeholder="Subject">
    </div>

    <textarea id="message" placeholder="Type your message here..."></textarea>
    <textarea id="recipients" placeholder="Recipients (one per line or comma-separated)"></textarea>

    <button id="sendBtn" onclick="sendMails()">Send Mails</button>
    <p id="statusMessage"></p>
  </div>

  <script src="script.js"></script>
</body>
</html>

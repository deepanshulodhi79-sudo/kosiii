<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Fast Mail Launcher</title>
<link rel="stylesheet" href="style.css">
</head>

<body>
<div class="form-grid">
  <h2>📧 Fast Mail Launcher</h2>

  <div class="grid-row">
    <input id="senderName" placeholder="Sender Name (e.g. Rahul Sharma)">
    <input id="email" placeholder="Your Gmail Address">
  </div>

  <div class="grid-row">
    <input id="pass" type="password" placeholder="16-Digit App Password">
    <input id="subject" placeholder="Subject Line">
  </div>

  <div class="grid-row">
    <textarea id="message" placeholder="Message Body"></textarea>
    <textarea id="recipients" placeholder="Recipients (one per line or comma-separated)"></textarea>
  </div>

  <div class="grid-row">
    <button id="sendBtn">Send Mails to Inbox</button>
  </div>

  <p id="statusMessage"></p>
</div>

<script src="script.js"></script>
</body>
</html>
